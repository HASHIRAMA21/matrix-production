# Configuration nginx pour Matrix Synapse (à ajouter au nginx VPS existant)
# Placez ce fichier dans /etc/nginx/sites-available/matrix.conf
# Puis : sudo ln -s /etc/nginx/sites-available/matrix.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name matrix.ndinga237.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name matrix.ndinga237.com;

    # SSL Configuration (adaptez selon votre configuration SSL)
    ssl_certificate /etc/letsencrypt/live/matrix.ndinga237.com/fullchain.pem;
    ssl_private_key /etc/letsencrypt/live/matrix.ndinga237.com/privkey.pem;

    # Matrix client API et sync
    location ~ ^(\/_matrix|\/_synapse\/client) {
        proxy_pass http://127.0.0.1:8445;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Nginx-Proxy true;
        proxy_redirect off;

        # Timeouts pour les long-polling
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Well-known pour Matrix
    location /.well-known/matrix/server {
        return 200 '{"m.server": "matrix.ndinga237.com:8448"}';
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    location /.well-known/matrix/client {
        return 200 '{"m.homeserver": {"base_url": "https://matrix.ndinga237.com"}}';
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
}

# Federation (port 8448)
server {
    listen 8448 ssl http2;
    server_name matrix.ndinga237.com;

    ssl_certificate /etc/letsencrypt/live/matrix.ndinga237.com/fullchain.pem;
    ssl_private_key /etc/letsencrypt/live/matrix.ndinga237.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8448;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}