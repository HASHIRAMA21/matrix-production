# Configuration nginx pour Element (à ajouter au nginx VPS existant)
# Placez ce fichier dans /etc/nginx/sites-available/element.conf
# Puis : sudo ln -s /etc/nginx/sites-available/element.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name element.matrix.ndinga237.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name element.matrix.ndinga237.com;

    # SSL Configuration (adaptez selon votre configuration SSL)
    ssl_certificate /etc/letsencrypt/live/element.matrix.ndinga237.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/element.matrix.ndinga237.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Element static files (adaptez le chemin)
    root /home/vincess/DEVOPS/matrix-production/element;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Security
    location ~ /\. {
        deny all;
    }
}