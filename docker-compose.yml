version: '3.8'

networks:
  matrix:
    external: true
    name: matrix-network
  web:
    external: true
    name: web

services:
  # Configuration des permissions
  volume-permissions:
    image: busybox:1.36
    container_name: matrix_volume_permissions
    volumes:
      - synapse_data:/synapse_data
      - prometheus_data:/prometheus_data
      - grafana_data:/grafana_data
      - coturn_data:/coturn_data
      - ./synapse/config:/synapse_config
      - ./synapse/keys:/synapse_keys
      - ./synapse/data:/synapse_host_data
    command: >
      sh -c "
      chown -R 991:991 /synapse_data /synapse_config /synapse_keys /synapse_host_data &&
      chown -R 65534:65534 /prometheus_data &&
      chown -R 472:0 /grafana_data &&
      chown -R 101:102 /coturn_data &&
      chmod -R 755 /synapse_data /synapse_config /synapse_host_data &&
      chmod -R 750 /synapse_keys &&
      chmod -R 755 /prometheus_data /grafana_data /coturn_data &&
      echo 'Permissions configurées avec succès!'
      "
    restart: "no"
    user: "0:0"

  # Reverse proxy Traefik
  traefik:
    image: traefik:v3.1
    container_name: matrix_traefik
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8081}:80"
      - "${HTTPS_PORT:-8445}:443"
      - "8448:8448"
      - "3478:3478"
      - "5349:5349"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_certs:/certs
    environment:
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=admin@${DOMAIN}
      - TZ=${TZ}
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dash.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dash.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dash.service=api@internal"
      - "traefik.http.routers.traefik-dash.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_USER}:${TRAEFIK_DASHBOARD_PASSWORD_HASH}"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Matrix Synapse
  synapse:
    image: matrixdotorg/synapse:${SYNAPSE_VERSION:-latest}
    container_name: matrix_synapse
    restart: unless-stopped
    user: "991:991"
    security_opt:
      - apparmor=unconfined
    extra_hosts:
      - "postgres.host:${POSTGRES_HOST}"
      - "redis.host:${REDIS_HOST}"
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      UID: 991
      GID: 991
      TZ: ${TZ}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TURN_SECRET: ${TURN_SECRET}
      REGISTRATION_SHARED_SECRET: ${REGISTRATION_SHARED_SECRET}
    volumes:
      - synapse_data:/data
      - ./synapse/config/homeserver.yaml:/data/homeserver.yaml:ro
      - ./synapse/config/log.config:/data/log.config:ro
      - ./synapse/keys:/data/keys:ro
      - ./synapse/data/media_store:/data/media_store
      - ./synapse/data/logs:/data/logs
      - ./synapse/data/uploads:/data/uploads
    networks:
      - matrix
      - web
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.synapse.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.synapse.entrypoints=websecure"
      - "traefik.http.routers.synapse.tls.certresolver=letsencrypt"
      - "traefik.http.routers.synapse.service=synapse"
      - "traefik.http.services.synapse.loadbalancer.server.port=8008"
      - "traefik.http.routers.synapse-federation.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.synapse-federation.entrypoints=federation"
      - "traefik.http.routers.synapse-federation.tls.certresolver=letsencrypt"
      - "traefik.http.routers.synapse-federation.service=synapse-federation"
      - "traefik.http.services.synapse-federation.loadbalancer.server.port=8008"
      - "traefik.http.middlewares.matrix-headers.headers.customRequestHeaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.synapse.middlewares=matrix-headers"
      - "traefik.http.routers.synapse-federation.middlewares=matrix-headers"
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:8008/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # NOTE: nginx supprimé - utilise le nginx existant sur la VPS
  # Configurez votre nginx VPS pour servir Element depuis ./element/

  # Serveur TURN/STUN
  coturn:
    image: coturn/coturn:4.6.2-alpine
    container_name: matrix_coturn
    restart: unless-stopped
    user: "101:102"
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET}
      REALM: ${DOMAIN}
      TZ: ${TZ}
    volumes:
      - coturn_data:/var/lib/coturn
      - traefik_certs:/certs:ro
    command: >
      -c /etc/coturn/turnserver.conf
      --listening-port=3478
      --tls-listening-port=5349
      --min-port=49152
      --max-port=65535
      --fingerprint
      --lt-cred-mech
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --realm=${DOMAIN}
      --server-name=${DOMAIN}
      --cert=/certs/live/${DOMAIN}/fullchain.pem
      --pkey=/certs/live/${DOMAIN}/privkey.pem
      --no-multicast-peers
      --no-cli
      --log-file=stdout
      --simple-log
    depends_on:
      volume-permissions:
        condition: service_completed_successfully

  # Monitoring Prometheus
  prometheus:
    image: prom/prometheus:v2.47.2
    container_name: matrix_prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    environment:
      - TZ=${TZ}
    networks:
      - matrix
      - web
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prometheus.middlewares=auth"

  # Dashboard Grafana
  grafana:
    image: grafana/grafana:10.1.5
    container_name: matrix_grafana
    restart: unless-stopped
    user: "472:0"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${PROMETHEUS_PASSWORD}
      GF_SECURITY_ADMIN_USER: admin
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      TZ: ${TZ}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    networks:
      - matrix
      - web
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"

volumes:
  traefik_certs:
    name: matrix_traefik_certs
  prometheus_data:
    name: matrix_prometheus_data
  grafana_data:
    name: matrix_grafana_data
  synapse_data:
    name: matrix_synapse_data
  coturn_data:
    name: matrix_coturn_data